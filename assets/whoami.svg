  <g fill="#7ee787">
    <text x="300" y="144">rol</text>
    <text x="300" y="166">ubicación</text>
    <text x="300" y="188">enfoque</text>
    <text x="300" y="210">iot</text>
    <text x="300" y="232">datos</text>
    <text x="300" y="254">backend</text>
    <text x="300" y="276">frontend</text>
    <text x="300" y="298">bd / cloud</text>
