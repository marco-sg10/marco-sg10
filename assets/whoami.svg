  <rect x="348" y="360" width="22" height="12" fill="#e3b341"/>
  <rect x="372" y="360" width="22" height="12" fill="#7ee787"/>
  <rect x="396" y="360" width="22" height="12" fill="#79c0ff"/>
  <rect x="420" y="360" width="22" height="12" fill="#d2a8ff"/>

