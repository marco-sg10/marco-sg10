    <text x="410" y="188">Datos · IoT · Full Stack</text>
    <text x="410" y="210">ESP32 · Arduino Cloud · Raspberry Pi</text>
    <text x="410" y="232">Python · R · Power BI · SQL</text>
    <text x="410" y="254">Java · Spring Boot · JWT · API REST</text>
    <text x="410" y="276">React · React Native</text>
    <text x="410" y="298">PostgreSQL · AWS</text>
    <text x="410" y="320">Español · English (A2, en progreso)</text>
    <text x="428" y="342">Abierto a freelance y prácticas</text>
