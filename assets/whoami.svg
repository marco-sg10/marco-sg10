  <path d="M0.5 34 V10.5 a10 10 0 0 1 10 -10 H809.5 a10 10 0 0 1 10 10 V34 Z" fill="#161b22"/>
  <circle cx="22" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="17" r="6" fill="#ffbd2e"/>
